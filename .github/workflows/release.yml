name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            arch: x64
          - os: macos-latest
            target: mac
            arch: arm64
          - os: macos-15-intel
            target: mac
            arch: x64
          - os: ubuntu-latest
            target: linux
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CMake (Linux)
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Install CMake (macOS)
        if: matrix.target == 'mac'
        run: brew install cmake

      - name: Prepare Python build environment
        run: |
          python -m pip install --upgrade pip
          # PyInstaller's pkg_resources runtime hook still requires
          # NullProvider, which setuptools removed in 82. Keep the build
          # environment on the last compatible release until that hook is gone.
          # 81 also satisfies torch 2.13's setuptools>=77 requirement.
          pip install "setuptools==81.0.0" cmake pyinstaller

      # The prebuilt Linux AppImage is intentionally CPU-only. A CUDA-enabled
      # PyTorch wheel makes the frozen backend exceed GitHub's 2 GiB per-asset
      # limit by bundling the NVIDIA runtime libraries. Source installs can
      # still use setup.sh/setup_backend.py to select a CUDA build.
      - name: Install CPU-only PyTorch (Linux release)
        if: matrix.target == 'linux'
        run: |
          python -m pip install "torch==2.2.2" "torchvision==0.17.2" --index-url https://download.pytorch.org/whl/cpu

      # Install from requirements.txt rather than a hardcoded list so CI cannot
      # drift from what the backend actually imports. cmake/pyinstaller are
      # build-time only and are therefore not in requirements.txt.
      - name: Install Python dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r requirements-dev.txt
          python -c "import pkg_resources; assert hasattr(pkg_resources, 'NullProvider'), 'PyInstaller requires pkg_resources.NullProvider'"
          python -c "import cv2, numpy, torch; assert numpy.__version__ == '1.26.4'; torch.tensor([1]).numpy(); print('Runtime ABI check:', cv2.__version__, numpy.__version__, torch.__version__)"

      - name: Verify CPU-only PyTorch (Linux release)
        if: matrix.target == 'linux'
        run: python -c "import torch; assert torch.version.cuda is None, f'Linux release must be CPU-only, found CUDA {torch.version.cuda}'; print('Linux release Torch:', torch.__version__, 'CPU-only')"

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck and lint
        run: |
          npx tsc --noEmit
          npm run lint

      # A tagged release must not ship code that fails its own suites. The
      # Python run also exercises the dispatch/lineage contracts the packaged
      # backend depends on.
      - name: Run tests
        run: |
          npm run test:contracts
          npm run test:electron
          python -m pytest

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run publish:${{ matrix.target }} -- --${{ matrix.arch }}
