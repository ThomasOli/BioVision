name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            arch: x64
          - os: macos-latest
            target: mac
            arch: arm64
          - os: macos-15-intel
            target: mac
            arch: x64
          - os: ubuntu-latest
            target: linux
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CMake (Linux)
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Install CMake (macOS)
        if: matrix.target == 'mac'
        run: brew install cmake

      # Install from requirements.txt rather than a hardcoded list so CI cannot
      # drift from what the backend actually imports. cmake/pyinstaller are
      # build-time only and are therefore not in requirements.txt.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # PyInstaller's pkg_resources runtime hook still requires
          # NullProvider, which setuptools removed in 82. Keep the build
          # environment on the last compatible major until that hook is gone.
          pip install "setuptools<82" cmake pyinstaller
          pip install -r backend/requirements.txt
          pip install -r requirements-dev.txt
          python -c "import pkg_resources; assert hasattr(pkg_resources, 'NullProvider'), 'PyInstaller requires pkg_resources.NullProvider'"

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck and lint
        run: |
          npx tsc --noEmit
          npm run lint

      # A tagged release must not ship code that fails its own suites. The
      # Python run also exercises the dispatch/lineage contracts the packaged
      # backend depends on.
      - name: Run tests
        run: |
          npm run test:contracts
          npm run test:electron
          python -m pytest

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run publish:${{ matrix.target }} -- --${{ matrix.arch }}
